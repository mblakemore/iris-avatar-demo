<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iris — OpenAvatar demo</title>
<meta name="description" content="A talking head-and-shoulders avatar rendered live in your browser. She breathes, blinks, looks at you and reacts; press play to hear her speak.">
<style>
  :root { color-scheme: dark; --bg: #14151a; --fg: #ececf2; --mut: #9a9cab; --line: rgba(236,236,242,.22); --acc: #8fb0ff; --bar: rgba(26,27,34,.82); --rec: #ff5d5d; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  header { position: fixed; left: 0; right: 0; top: 0; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  header p { margin: 2px 0 0; color: var(--mut); font-size: 13px; }
  #state { display: inline-block; margin-top: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--mut); font-size: 12px; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; padding: 8px; background: var(--bar); border: 1px solid var(--line); border-radius: 24px; backdrop-filter: blur(8px); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; white-space: nowrap; }
  button:hover, button:focus-visible { border-color: var(--acc); outline: none; }
  button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
  #play { background: var(--acc); border-color: var(--acc); color: #10131c; font-weight: 600; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--mut); pointer-events: none; text-align: center; padding: 0 24px; }
  #note { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); color: var(--mut); font-size: 12.5px; text-align: center; max-width: calc(100vw - 32px); pointer-events: none; }
  #camInd { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(40px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--mut); }
  #camInd::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }
  @media (max-width: 560px) { #info { display: none; } #bar { border-radius: 20px; } button { padding: 8px 12px; } #note { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); } }
  #info { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); color: var(--mut); font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c" aria-label="Iris, a 3D avatar. Drag to turn her head."></canvas>
<header><h1>Iris</h1><p>Drag to turn her head · scroll or pinch to zoom</p><span id="state" hidden></span></header>
<div id="info"></div>
<div id="camInd" hidden>camera on (this device only)</div>
<div id="msg">Loading…</div>
<div id="note" hidden></div>
<div id="bar" hidden>
  <button id="play">Hear her speak</button>
  <button id="talk" aria-pressed="false" hidden>Talk to her</button>
  <button id="see" aria-pressed="false" hidden>Let her see you</button>
  <button id="reset">Reset view</button>
</div>
<audio id="aud" src="sample.mp3" preload="auto"></audio>
<script type="module">
import { OpenAvatarViewer } from "./openavatar-viewer.js";
import { createBehaviour, parseTags, anchorCues } from "./openavatar-behaviour.js";
const $ = id => document.getElementById(id);
const note = (t, ms = 6000) => { const n = $("note"); n.textContent = t; n.hidden = !t; clearTimeout(note.h); if (t && ms) note.h = setTimeout(() => { n.hidden = true; }, ms); };
try {
  const v = await OpenAvatarViewer.create($("c"), {
    modelUrl: "iris.bin", pointer: true, background: "#14151a", limits: OpenAvatarViewer.FREE_HEAD,
    on: { progress: f => { $("msg").textContent = "Loading " + Math.round(f * 100) + "%"; },
          frame: s => { $("info").textContent = `${s.n.toLocaleString()} Gaussians · ${s.fps.toFixed(0)} fps`; } }
  });
  $("msg").hidden = true; $("bar").hidden = false;
  const a = $("aud");

  // speech: timed lip sync from the line's character timings (falls back to loudness)
  let line = null;
  try { line = await (await fetch("sample.json")).json(); } catch {}
  await OpenAvatarViewer.loadLexicon();
  const timings = line && line.timings;
  if (timings) { v.attachAudio(a, { driver: "timed" }); v.setDriver("timed", { timings }); v.setTrack({ timings }); }
  else v.attachAudio(a, { driver: "loudness" });

  // life: breathing, blinks, gaze, listening / thinking / speaking states, head motion from her voice's pitch, expression cues
  const b = createBehaviour(v, { persona: { seed: 1 } });
  let visits = 1; try { visits = (+localStorage.getItem("iris.visits") || 0) + 1; localStorage.setItem("iris.visits", String(visits)); } catch {}
  b.remember({ visits });
  b.setMood({ valence: 0.25, arousal: 0.45, engagement: 0.7 });
  const NAMES = { idle: "idle", listening: "listening", thinking: "thinking", speaking: "speaking", yielding: "your turn" };
  b.on("state", e => { const s = e && e.state; $("state").hidden = false; $("state").textContent = NAMES[s] || s; });
  // expression cues written into the line, as an LLM would ([smile], [brow], ...): stripped from the text, timed on its words
  const TAGGED = "Hello, [smile] I'm Iris. Drag to turn my head, scroll to zoom, and click the button [brow] whenever you'd like to hear me speak.";
  let cues = [];
  if (timings) { const P = parseTags(TAGGED); if (P.text === line.text) cues = anchorCues(P.tags, timings); }
  let pcm = null, rate = 16000;
  try {
    const buf = await (await fetch("sample.mp3")).arrayBuffer();
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext, ab = await new OAC(1, 1, rate).decodeAudioData(buf);
    pcm = new Float32Array(ab.length); for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < pcm.length; i++) pcm[i] += d[i] / ab.numberOfChannels; }
    rate = ab.sampleRate;
  } catch {}

  const label = () => { $("play").textContent = a.paused ? "Hear her speak" : "Stop"; };
  let pending = 0;
  const toggle = () => {
    if (!a.paused || pending) { clearTimeout(pending); pending = 0; a.pause(); b.yield(); label(); return; }
    b.think();                                             // a short "thinking" beat: a glance away and an in-breath before she answers
    $("play").textContent = "Stop";
    pending = setTimeout(() => {
      pending = 0; a.currentTime = 0;
      b.speak({ pcm: pcm || undefined, sampleRate: rate, timings: timings || undefined, cues, clock: () => a.currentTime, duration: Number.isFinite(a.duration) ? a.duration : undefined });
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => { b.yield(); label(); note("Your browser blocked the sound: press again."); });
    }, 700);
  };
  a.addEventListener("play", label); a.addEventListener("pause", label); a.addEventListener("ended", label);
  $("play").onclick = toggle;

  // her head drifts back to the centre a few seconds after you let go (her own small movements carry on on top)
  const base = { yaw: 0, pitch: 0, roll: 0 }; let lastTouch = 0, easing = false, down = null, ptrDown = false;
  const setPose0 = v.setPose.bind(v);
  v.setPose = p => { for (const k of ["yaw", "pitch", "roll"]) if (p[k] !== undefined) base[k] = +p[k]; if (!easing) lastTouch = performance.now(); return setPose0(p); };
  const RETURN_AFTER = 4000, RETURN_TIME = 1600;
  let from = null, t0 = 0;
  (function tick() {
    const now = performance.now(), off = Math.abs(base.yaw) + Math.abs(base.pitch) + Math.abs(base.roll);
    if (from) {
      const u = Math.min(1, (now - t0) / RETURN_TIME), k = 1 - u * u * (3 - 2 * u);
      easing = true; v.setPose({ yaw: from.yaw * k, pitch: from.pitch * k, roll: from.roll * k }); easing = false;
      if (u >= 1 || lastTouch > t0) from = null;
    } else if (off > 1e-4 && now - lastTouch > RETURN_AFTER && !ptrDown) { from = { ...base }; t0 = now; }
    requestAnimationFrame(tick);
  })();
  $("reset").onclick = () => v.setPose({ yaw: 0, pitch: 0, roll: 0, zoom: 1 });

  // a click on her (a press that did not turn into a drag) also plays the line; she glances at the pointer near her face
  $("c").addEventListener("pointerdown", e => { ptrDown = true; down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  addEventListener("pointerup", () => { ptrDown = false; });
  addEventListener("pointercancel", () => { ptrDown = false; });
  $("c").addEventListener("pointerup", e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 400) toggle();
    down = null;
  });
  $("c").addEventListener("pointermove", e => {
    if (e.buttons || e.pointerType !== "mouse") return;
    const r = $("c").getBoundingClientRect(), x = (e.clientX - (r.left + r.width / 2)) / r.width, y = (e.clientY - (r.top + r.height * 0.4)) / r.height;
    if (Math.abs(x) < 0.6 && Math.abs(y) < 0.6 && Math.hypot(x, y) > 0.15) b.glanceAt(x * 30, -y * 24);
  });
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = performance.now(); else if (hiddenAt && performance.now() - hiddenAt > 5000) b.noticeUser(); });
  addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); } });

  // optional: she listens while you talk (microphone level only, analysed here, nothing recorded or sent)
  const media = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  let listen = null;
  if (media) $("talk").hidden = false;
  $("talk").onclick = async () => {
    if (listen) { listen.stop(); listen = null; b.attachListener(null); $("talk").setAttribute("aria-pressed", "false"); $("talk").textContent = "Talk to her"; note(""); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const L = await import("./openavatar-listen.js"); const lis = L.createListener(stream, { vad: false, turn: false }); await lis.start();
      listen = { stop: () => { try { lis.stop(); } catch {} stream.getTracks().forEach(t => t.stop()); } };
      b.attachListener(lis); $("talk").setAttribute("aria-pressed", "true"); $("talk").textContent = "Stop talking";
      note("She's listening: talk to her and pause now and then. Only the loudness of your voice is used, in this browser. She doesn't answer yet.", 9000);
    } catch (e) { note("Microphone not available: " + e.message); }
  };

  // optional: she looks at you (camera analysed in this browser with MediaPipe; no image is kept or sent)
  let cam = null;
  if (media) $("see").hidden = false;
  $("see").onclick = async () => {
    if (cam) { cam.stop(); cam = null; b.attachAttention(null); $("camInd").hidden = true; $("see").setAttribute("aria-pressed", "false"); $("see").textContent = "Let her see you"; return; }
    if (!confirm("Let her see you? Your camera image is analysed only in this browser (where your face is, whether you smile) so she can look at you. Nothing is recorded or sent anywhere.")) return;
    note("Starting the camera…", 0);
    try {
      const A = await import("./openavatar-attention.js"), u = p => new URL(p, location.href).href;
      const att = A.createAttention({ fps: 10, visionUrl: u("vendor/mediapipe/vision_bundle.mjs"), wasmBase: u("vendor/mediapipe/wasm"), modelUrl: u("vendor/mediapipe/face_landmarker.task") });
      await att.start();
      cam = att; b.attachAttention(att); $("camInd").hidden = false; $("see").setAttribute("aria-pressed", "true"); $("see").textContent = "Camera off";
      note("She can see you now: move around, smile, look away.", 6000);
    } catch (e) { note("Camera not available: " + e.message); }
  };
} catch (e) { $("msg").textContent = "Could not start: " + e.message; }
</script>
</body>
</html>
